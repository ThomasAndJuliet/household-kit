[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# File::try_lock (household-settings' folder lock)
rust-version = "1.89"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/ThomasAndJuliet/household-kit"

[workspace.dependencies]
tokio = { version = "1", default-features = false }

# For this workspace's own build only (the widgets' tests, Clippy and CI): the
# household libcosmic fork at a fixed revision. Cargo reads [patch] only
# from the workspace being built, so an app that depends on household-widgets
# never sees this one: its own [patch] on pop-os/libcosmic (every household
# app has it) chooses the libcosmic this crate is built with, and there is
# one libcosmic in its lock. Move this pin when the apps move, so that CI
# here builds against what they use.
[patch."https://github.com/pop-os/libcosmic.git"]
libcosmic = { git = "https://github.com/ThomasAndJuliet/libcosmic.git", rev = "cb889ef4bbfccd45739d5fa6f9140fd0e53df9fa" }
cosmic-config = { git = "https://github.com/ThomasAndJuliet/libcosmic.git", rev = "cb889ef4bbfccd45739d5fa6f9140fd0e53df9fa" }
