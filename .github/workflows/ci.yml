name: CI
# The kit's own checks: formatting, Clippy and every crate's tests
# (household-ui TESTING.md §4; testing plan, Phase 0). The runner and its
# fallback are neo-infrastructure's (services/ci-runners): neo's Ubuntu
# runner by default, GitHub-hosted when the CI_RUNNER variable is "hosted".
# household-kit is a library, so there is no Flatpak build here. No crate
# here depends on libcosmic or on another private repository, so the job
# needs no secrets.
#
# Not here yet: testing the apps' kit-related tests against the kit commit
# being pushed (see the testing plan's Phase 0). It needs read keys for
# each app and its private dependencies, and a full app build per push;
# the Phase 1 step 2 report says what it would take.
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Format, Clippy and tests
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-24.04' || 'neo-ubuntu' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version neo's build toolbox has, so that formatting and Clippy
      # say the same in CI as in the builds agents run there
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
