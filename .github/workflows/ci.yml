name: CI
# The kit's own checks: formatting, Clippy and every crate's tests.
# household-kit is a library, so there is no Flatpak build here. No crate
# here depends on libcosmic or on another private repository, so the job
# needs no secrets.
#
# This repository is public. Code from a fork's pull request must never run
# on the household's self-hosted runner, so those runs use a GitHub-hosted
# runner with the read-only token below. The self-hosted runner is used only
# for pushes, manual runs and pull requests from this repository, which only
# people with write access can open. Never trigger on pull_request_target.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Format, Clippy and tests
    # A fork's pull request has no secrets or variables, and must not reach
    # the self-hosted runner. Everything else uses the self-hosted runner
    # unless the CI_RUNNER variable is "hosted".
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || (vars.CI_RUNNER == 'hosted' && 'ubuntu-24.04' || 'neo-ubuntu') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The household's pinned toolchain, so that formatting and Clippy say
      # the same in CI as in local builds
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
